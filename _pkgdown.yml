template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

development:
  mode: auto

url: https://kskbhat.github.io/Silhouette

repo:
  github: kskbhat/Silhouette
  branch: main
  source: true

search: true

home:
  title: Silhouette Package
  sidebar:
    structure: [downloads, inviews, links, license, community, citation, authors, dev]
    components:
      downloads:
        title: "Downloads"
        text: |
          [![CRAN monthly downloads](https://cranlogs.r-pkg.org/badges/last-month/Silhouette?color=brightgreen)](https://kskbhat.r-universe.dev/Silhouette)
          [![CRAN total downloads](https://cranlogs.r-pkg.org/badges/grand-total/Silhouette?color=blue)](https://r-pkg.org/pkg/Silhouette)
      inviews:
        title: "In Views"
        text: |
          [![CRAN Task View: Cluster](https://img.shields.io/badge/CRAN%20Task%20View-Cluster-orange)](https://CRAN.R-project.org/view=Cluster)

authors:
  Shrikrishna Bhat K:
    href: "https://github.com/kskbhat"
  Kiruthika C:
    href: "https://www.pondiuni.edu.in/faculy_profiles/dr-kiruthika/"

reference:
  - title: Widths from distances or similarities
    desc: >
      Simplified silhouette widths from an n x K matrix of proximities between
      observations and clusters, with medoid or PAC normalization.
    contents:
      - Silhouette
  - title: Widths from membership probabilities
    desc: >
      Silhouette widths for soft and model-based clustering, computed from
      membership or posterior probabilities.
    contents:
      - softSilhouette
      - cerSilhouette
      - dbSilhouette
  - title: All widths at once
    contents:
      - calSilhouette
  - title: Block and multi-way clustering
    contents:
      - extSilhouette
  - title: Silhouette objects and plots
    contents:
      - plotSilhouette
      - getSilhouette
      - is.Silhouette

articles:
  - title: Using Silhouette
    navbar: Using Silhouette
    contents:
      - soft-clustering
      - interpreting-widths
      - multiway
  - title: More
    navbar: More
    contents:
      - articles/plotting
      - articles/case-study-thyroid
      - articles/benchmarks

navbar:
  structure:
    right: [search, github, lightswitch]
